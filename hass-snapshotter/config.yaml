name: hass-snapshotter
version: 0.4.0
slug: hass-snapshotter
description: Render Home Assistant data to PNG images for e-paper displays, without a browser
url: https://github.com/LordMike/hass-snapshotter
image: ghcr.io/lordmike/hass-snapshotter
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
homeassistant_api: true
map:
  - type: homeassistant_config
    read_only: true
ports:
  8080/tcp: 10010
watchdog: http://[HOST]:[PORT:8080]/healthz
options:
  pages_dir: /homeassistant/dashboard-pages
  render_timeout_ms: 30000
schema:
  pages_dir: str
  render_timeout_ms: int(1000,120000)
  ha_url: url?
  ha_token: password?
