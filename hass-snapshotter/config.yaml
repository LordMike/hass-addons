name: hass-snapshotter
version: 0.4.7
slug: hass-snapshotter
description: Render Home Assistant data to PNG images for e-paper displays, without a browser
url: https://github.com/LordMike/hass-snapshotter
image: ghcr.io/lordmike/hass-snapshotter
arch:
  - aarch64
  - amd64
init: false
homeassistant_api: true
map:
  - type: homeassistant_config
    read_only: true
ports:
  8080/tcp: 10010
webui: "http://[HOST]:[PORT:8080]/"
options:
  pages_dir: /homeassistant/dashboard-pages
  render_timeout_ms: 30000
  renderer_keep_alive: 0
  index_page: true
schema:
  pages_dir: str
  render_timeout_ms: int(1000,120000)
  renderer_keep_alive: int(0,86400)
  index_page: bool
  ha_url: url?
  ha_token: password?
  auth_username: str?
  auth_password: password?
  auth_header: password?
