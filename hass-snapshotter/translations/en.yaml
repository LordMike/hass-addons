configuration:
  pages_dir:
    name: Pages folder
    description: Folder with page files (<name>.js). /homeassistant is Home Assistant's config folder, so the default is /config/dashboard-pages as seen from HA.
  render_timeout_ms:
    name: Render timeout (ms)
    description: Maximum time for one render, including fetching entities.
  renderer_keep_alive:
    name: Keep renderer running (seconds)
    description: 0 starts a fresh renderer process for every render, which keeps memory low when idle. A number of seconds keeps the process after a render and reuses it for the next one, making renders faster (no start-up, fonts already loaded), at the cost of about 85 MB more memory while it is kept. It only helps if renders come more often than this many seconds apart; otherwise the process is ended and the memory freed before it is used again.
  index_page:
    name: Index page
    description: Serve the page list at /. Turn off to hide which pages exist; the pages themselves still work.
  ha_url:
    name: Home Assistant URL (optional)
    description: Leave empty to use the built-in connection through the Supervisor.
  ha_token:
    name: Long-lived token (optional)
    description: Leave empty to use the built-in connection. Only needed together with a custom URL.
  auth_username:
    name: Username (optional)
    description: With a password, every request must use HTTP Basic Auth. Leave empty for no authentication.
  auth_password:
    name: Password (optional)
    description: Password for HTTP Basic Auth.
  auth_header:
    name: Authorization header (optional)
    description: "Instead of a username and password: the exact Authorization header value every request must carry, e.g. Bearer <token>."
network:
  8080/tcp: Render endpoint. Open it in a browser to list and preview pages. HA itself can reach the app on its hostname, port 8080 (shown on the app page).
